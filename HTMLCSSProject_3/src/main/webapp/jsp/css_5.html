<!-- 
     박스 모델
       1. 외부 간격 조절 : 태그와 태그 사이 여백
          margin
            => margin-top
               margin-right
               margin-bottom
               margin-left
             margin : 위 4개 순서대로 한 번에 들어감
       2. 내부 간격 조절 : 태그안에 글자 / 이미지
          padding
            => padding-top
               padding-right
               padding-bottom
               padding-left
             padding : margin이랑 마찬가지
               
       3. 테두리
          border
               border-style : 선 종류
               border-width : 두께
               border-color : 색상
               border-collapse : 테두리 통합
               border-radius : 타원형
           border : 위 3개 들어감 순서는 상관 없음 
           
           1,2,3 필요하면 (-)쓰면 됨
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
img {
  border: 2px solid red;
  border-top-left-radius: 50px;
  border-bottom-right-radius: 50px;
}
</style>
</head>
<body>
  <img src="../images/m1.jpg">
</body>
</html>
