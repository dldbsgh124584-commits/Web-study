<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
div {
  width: 200px;
  height: 200px;
  background-color:blue;
}
.box1{
  margin:30px; 
}
.box2{
  margin:30px 50px;
}
.box3{
  margin:30px 30px 30px;
}
.box4{
  margin:30px 50px 30px 50px;
}
/*
   브라우저 안에서 태그와 태그의 여백 : margin
*/
</style>
</head>
<body>
  <div class="box1"></div><!-- 태그를 모아서 관리 / 새로 분할 : 출력 모양이 없다 : CSS  -->
  <div class="box2"></div>
  <div class="box3"></div>
  <div class="box4"></div>
</body>
</html>
