<!-- 
    자손 선택자 : 태그 > 태그 > 태그 ...
    후손 선택자 : 태그 태그 태그
    동위 선택자 : 태그 + 태그 , 태그 ~ 태그 
    ---------------- 크롤링 
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.aaa > img{
  border-raius : 100 px;
}
div>p+h1{
  background: rgb(252,17,137);
  color:green;
}
div span h1{
  background: #4B1A56;
}
div > p~h1 {
  background: #CCCCFF;
}
/*
   div h1 ==> h1 전체 포함
   div > h1 ==> div 밑에있는 h1만 
*/
</style>
</head>
<body>
   <div class="aaa">
    <img src="../images/m1.jpg">
   </div>
   <div class="bbb">
    <img src="../images/m2.jpg">
   </div>
   <div class="ccc">
    <img src="../images/m3.jpg">
   </div>
   <div class="aaa">
    <img src="../images/m4.jpg">
   </div>
   <div class="bbb">
    <img src="../images/m5.jpg">
   </div>
   <hr>
   <div>
     <p>Hello CSS</p>
     <h1>형제 1</h1>
     <h1>형제 2</h1>
     <span>
      <h1>후손 1</h1>
     </span>
   </div>
</body>
</html>
