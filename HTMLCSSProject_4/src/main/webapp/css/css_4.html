<!-- 
    display:none : 감춘다 => 더보기
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript" src="http://code.jquery.com/jquery.js"></script>
<script type="text/javascript">
let i=0;
$(function(){
   $('a').click(function(){
      if(i==0)
      {
         $('a').text("닫기")
         i=1;
         $('div').show();
         
      }
      else
      {
        $('a').text("더보기")
        i=0;
        $('div').hide()
      }
   })
})
</script>
</head>
<body>
   <pre>기이한 소문이 끊이지 않는 저수지 살목지의 로드뷰 화면에
	촬영한 적 없는 정체불명의 형체가 포착된다.
	오늘 안에 반드시 재촬영을 끝내야 하는 상황 속에
	살목지로 향한 PD ‘수인’(김혜윤)과 촬영팀.
	<a href="#">더보기</a>
	<div style="display:none">
	촬영이 시작되자 행방이 묘연했던 선배 ‘교식’(김준한)이 등장하고,
	설명되지 않는 일들이 연달아 벌어지며 촬영팀은 점점 아비규환에 빠진다.
		
	휘몰아치는 공포 속 ‘기태’(이종원)는 ‘수인’을 향해 내달리지만
	빠져나오려 할수록 이들은 점점 더 깊은 곳으로 끌려 들어가게 되는데…</div></pre>
</body>
</html>
